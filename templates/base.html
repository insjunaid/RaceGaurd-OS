<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RaceGuard — Concurrency, Demonstrated{% endblock %}</title>

  <!-- Google Fonts: Playfair Display (headings), Inter (body), JetBrains Mono (figures) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <!-- Top Navigation -->
  <header class="site-nav">
    <div class="site-wrapper">
      <nav class="nav-container" aria-label="Main Navigation">
        <a href="/" class="brand">
          <span class="brand-title">RaceGuard</span>
          <span class="brand-tagline">a study in concurrency</span>
        </a>
        <ul class="nav-links">
          <li><a href="/">Dashboard</a></li>
          <li><a href="/simulator">Simulator</a></li>
          <li><a href="/detection">Detection</a></li>
          <li><a href="/prevention">Prevention</a></li>
          <li><a href="/comparison">Comparison</a></li>
          <li><a href="/overview">Overview</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="site-wrapper">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="site-wrapper">
      <p class="footer-text">RaceGuard — a study in concurrency</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Common Client Script -->
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
